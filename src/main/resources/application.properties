
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/hotel_management}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:roshanhingnekar}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

logging.level.com.roshan.hotel=INFO

spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

app.jwt.secret=${JWT_SECRET}
app.jwt.ttl-seconds=3600


management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
